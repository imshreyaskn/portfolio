<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <title>Shreyas K N — AI agents, LLM security &amp; automation</title>
    <meta name="description" content="Shreyas K N is a computer science student building AI agents, LLM security tools and automation systems. Projects include Lurien Matrix, Valerie, Alethia, Lucy and Relay." />
    <meta name="author" content="Shreyas K N" />
    <meta property="og:site_name" content="Shreyas K N" />
    <meta property="og:title" content="Shreyas K N — AI agents, LLM security &amp; automation" />
    <meta property="og:description" content="Computer science student building AI agents, LLM security tools and automation systems." />
    <!-- Link previews (LinkedIn, X, Slack, WhatsApp, iMessage). Crawlers need
         absolute URLs. Regenerate the image with: node scripts/og/render.mjs -->
    <link rel="canonical" href="https://shreyaskns.vercel.app/" />
    <meta property="og:url" content="https://shreyaskns.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://shreyaskns.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="shreyas, building ai agents, llm security tools and automation systems, beside a silver sculpted portrait" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shreyas K N — AI agents, LLM security &amp; automation" />
    <meta name="twitter:description" content="Computer science student building AI agents, LLM security tools and automation systems." />
    <meta name="twitter:image" content="https://shreyaskns.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="shreyas, building ai agents, llm security tools and automation systems, beside a silver sculpted portrait" />

    <!-- Structured data: lets search engines connect this site to the profiles below. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "url": "https://shreyaskns.vercel.app/",
        "image": "https://shreyaskns.vercel.app/og-image.jpg",
        "name": "Shreyas K N",
        "jobTitle": "Computer Science Student",
        "description": "Builds AI agents, LLM security tools and automation systems.",
        "address": { "@type": "PostalAddress", "addressLocality": "Coimbatore", "addressRegion": "Tamil Nadu", "addressCountry": "IN" },
        "sameAs": [
          "https://github.com/imshreyaskn",
          "https://linkedin.com/in/imshreyaskn"
        ]
      }
    </script>

    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      Non-blocking font load: single combined request.
      The media="print" + onload trick avoids render-blocking while still
      loading the stylesheet asynchronously. <noscript> is the fallback.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Italiana&family=JetBrains+Mono:wght@400;500&family=Jost:wght@200;300;400;500&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Italiana&family=JetBrains+Mono:wght@400;500&family=Jost:wght@200;300;400;500&display=swap"
      >
    </noscript>

    <!-- Preload the LCP hero image so it fetches alongside JS, not after -->
    <link rel="preload" as="image" href="/hero-figure.webp" fetchpriority="high">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:40rem;margin:4rem auto;padding:0 1.5rem;font-family:Jost,system-ui,sans-serif;color:#EBEBF0;background:#000;line-height:1.6">
        <h1 style="font-family:Italiana,Georgia,serif;font-weight:400;font-size:3rem">shreyas</h1>
        <p>A computer science student building AI agents, LLM security tools and automation systems.</p>
        <p>This site needs JavaScript for its 3D scenes. You can still reach me at
          <a href="mailto:imshreyaskn@gmail.com" style="color:#fff">imshreyaskn@gmail.com</a>,
          <a href="https://github.com/imshreyaskn" style="color:#fff">GitHub</a> or
          <a href="https://linkedin.com/in/imshreyaskn" style="color:#fff">LinkedIn</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
