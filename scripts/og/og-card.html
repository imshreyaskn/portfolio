<!doctype html>
<!--
  Link-preview card (Open Graph / Twitter), 1200×630.
  Mirrors the hero: void background, sparse stars, the silver portrait on the
  right, "shreyas" in Italiana, lowercase Jost copy with wide tracking.

  Regenerate public/og-image.png with:
    node scripts/og/render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400&display=block" rel="stylesheet">
<style>
  :root {
    --text-primary: #EBEBF0;
    --text-secondary: #7A7A8C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    /* Same faint depth as the live page: void with a whisper of surface blue. */
    background:
      radial-gradient(ellipse 70% 90% at 22% 45%, rgba(29, 29, 43, 0.55), transparent 70%),
      #000;
  }

  #stars { position: absolute; inset: 0; }

  .portrait {
    position: absolute;
    right: -40px;
    bottom: -10px;
    height: 640px;
    /* Fade into the void on the left and bottom, like the hero mask. */
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 32%),
      linear-gradient(to bottom, #000 70%, transparent 98%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 32%),
      linear-gradient(to bottom, #000 70%, transparent 98%);
    mask-composite: intersect;
    filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.06));
  }

  .content {
    position: absolute;
    left: 88px;
    top: 50%;
    transform: translateY(-54%);
  }

  .silver {
    background: linear-gradient(110deg, rgba(255,255,255,0.45) 10%, #ffffff 48%, rgba(255,255,255,0.55) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .pretitle {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 0.4em;
    opacity: 0.7;
    margin-bottom: 18px;
  }

  .title {
    font-family: 'Italiana', serif;
    font-weight: 400;
    font-size: 168px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
  }

  .desc {
    margin-top: 34px;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 25px;
    line-height: 1.55;
    letter-spacing: 0.03em;
    color: rgba(235, 235, 240, 0.86);
    max-width: 560px;
  }

  .desc .soft { color: var(--text-secondary); }

  .footer {
    position: absolute;
    left: 88px;
    right: 88px;
    bottom: 52px;
    display: flex;
    align-items: center;
    gap: 22px;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 17px;
    letter-spacing: 0.32em;
    color: rgba(235, 235, 240, 0.62);
  }

  .footer .rule {
    width: 64px;
    height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,0.5), rgba(255,255,255,0.08));
  }

  /* Orb-nav echo: three small glowing dots, top-left, as on the live site. */
  .orbs { position: absolute; left: 88px; top: 60px; width: 40px; height: 40px; }
  .orbs i {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 16px rgba(107,156,255,0.4);
  }
  .orbs i:nth-child(1) { left: 2px;  top: 22px; }
  .orbs i:nth-child(2) { left: 18px; top: 4px; transform: scale(1.5); }
  .orbs i:nth-child(3) { left: 32px; top: 26px; }
</style>
</head>
<body>
  <div class="card">
    <canvas id="stars" width="1200" height="630"></canvas>

    <img class="portrait" src="../../public/hero-figure.webp" alt="" />

    <div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="content">
      <p class="pretitle silver" lang="ja">私は</p>
      <h1 class="title">shreyas</h1>
      <p class="desc">
        building ai agents, llm security tools<br />
        and automation systems. <span class="soft">at your service.</span>
      </p>
    </div>

    <div class="footer">
      <span class="rule"></span>
      <span>shreyaskns.vercel.app</span>
    </div>
  </div>

  <script>
    // Seeded starfield (mulberry32, same PRNG the Projects section uses) so the
    // card renders identically every time it's regenerated.
    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(7);
    const ctx = document.getElementById('stars').getContext('2d');
    const stars = [];
    for (let i = 0; i < 140; i++) {
      const depth = rand();
      stars.push({
        x: rand() * 1200,
        y: rand() * 630,
        r: depth < 0.75 ? 0.6 + rand() * 0.5 : 1.1 + rand() * 0.6,
        a: 0.18 + depth * 0.55,
      });
    }
    // Faint constellation lines between near neighbours, like the live starfield.
    ctx.lineWidth = 0.5;
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
        const d = Math.hypot(dx, dy);
        if (d < 70) {
          ctx.strokeStyle = `rgba(255,255,255,${(1 - d / 70) * 0.08})`;
          ctx.beginPath(); ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(stars[j].x, stars[j].y); ctx.stroke();
        }
      }
    }
    for (const s of stars) {
      ctx.fillStyle = `rgba(235,235,240,${s.a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  </script>
</body>
</html>
